plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "ftbpublicclaims-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.architectury.dev/' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (providers.gradleProperty('uiProbe').isPresent()) {
                systemProperty 'ftbpublicclaims.uiProbe', 'true'
                programArgument '--quickPlayMultiplayer'
                programArgument '127.0.0.1:25565'
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '720'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id},buyclaimchunks"
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"
    implementation "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    implementation "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"

    def buyClaimChunksJar = file('libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar')
    if (buyClaimChunksJar.exists()) {
        runtimeOnly files(buyClaimChunksJar)
    }

    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            ftb_chunks_version      : ftb_chunks_version,
            ftb_chunks_min_version  : ftb_chunks_min_version,
            ftb_teams_version       : ftb_teams_version,
            ftb_library_version     : ftb_library_version,
            architectury_version    : architectury_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    exclude 'io/github/nekomario28/ftbpublicclaims/PublicCompatibilityGameTests*.class'
}

def auditDistributableJar = tasks.register('auditDistributableJar') {
    dependsOn tasks.named('jar')

    doLast {
        File jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            Set<String> entries = zip.entries().collect { it.name } as Set<String>

            if (entries.any { it.startsWith('io/github/nekomario28/ftbpublicclaims/PublicCompatibilityGameTests') }) {
                throw new GradleException('GameTest classes must not be shipped in the distributable JAR')
            }
            if (entries.contains('pack.mcmeta')) {
                throw new GradleException('Stale pack.mcmeta must not be shipped')
            }
            if (!entries.contains('META-INF/neoforge.mods.toml')) {
                throw new GradleException('Generated NeoForge metadata is missing')
            }

            String metadata = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml')).getText('UTF-8')
            String expectedFtbChunksRange = "versionRange=\"[${ftb_chunks_min_version},2102)\""
            if (!metadata.contains(expectedFtbChunksRange)) {
                throw new GradleException("Distributable metadata is missing ${expectedFtbChunksRange}")
            }

            ['ftbteams', 'ftblibrary', 'architectury'].each { forbiddenDependency ->
                if (metadata.contains("modId=\"${forbiddenDependency}\"")) {
                    throw new GradleException(
                            "Runtime dependency metadata must match BuyClaimChunks and must not pin ${forbiddenDependency}")
                }
            }

            ['en_us.json', 'ja_jp.json'].each { language ->
                String path = "assets/${mod_id}/lang/${language}"
                def entry = zip.getEntry(path)
                if (entry == null) {
                    throw new GradleException("Missing language resource ${path}")
                }
                new groovy.json.JsonSlurper().parseText(zip.getInputStream(entry).getText('UTF-8'))
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn auditDistributableJar
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
