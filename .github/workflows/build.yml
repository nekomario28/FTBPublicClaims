name: Build

on:
  pull_request:
  push:
    branches:
      - public-claim-context
      - neoforge-1.21.1-port

permissions:
  contents: read

concurrency:
  group: ftbpublicclaims-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Download BuyClaimChunks Continued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download v1.1.1 \
            --repo nekomario28/BuyClaimChunks \
            --pattern 'buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar' \
            --dir libs

      - name: Compile and build
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify FTB Chunks client map ABI
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find ~/.gradle/caches -type f -name '*ftb-chunks-neoforge*2101.1.20*.jar' \
            ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$jar_path"
          javap -classpath "$jar_path" -private \
            dev.ftb.mods.ftbchunks.client.gui.ChunkScreenPanel | tee ftbchunks-chunkscreen-abi.txt
          grep -Eq 'selectedChunks' ftbchunks-chunkscreen-abi.txt

      - name: Smoke test NeoForge client startup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run-client
          set +e
          timeout --signal=TERM 180s xvfb-run -a \
            ./gradlew runClient --no-daemon --console=plain > client-smoke.log 2>&1
          exit_code=$?
          set -e

          if [[ "$exit_code" -ne 0 && "$exit_code" -ne 124 ]]; then
            cat client-smoke.log
            exit "$exit_code"
          fi

          grep -Fq 'FTB Public Claims' client-smoke.log
          grep -Fq 'FTB Chunks' client-smoke.log
          if grep -Fq 'FTB Chunks 2101 map integration is unavailable' client-smoke.log; then
            cat client-smoke.log
            exit 1
          fi
          if grep -Eq 'Crash report saved|Exception caught from mod|Failed to complete lifecycle event' client-smoke.log; then
            cat client-smoke.log
            exit 1
          fi

      - name: Run combined NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log
          grep -Eq 'All [0-9]+ required tests passed' gametest.log

      - name: Verify combined dedicated-server persistence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run
          cat > run/eula.txt <<'EOF'
          eula=true
          EOF
          cat > run/server.properties <<'EOF'
          enable-rcon=true
          rcon.password=ftbpublicclaims-ci
          rcon.port=25575
          online-mode=false
          server-port=25565
          EOF

          server_pid=''
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          rcon() {
            python3 .github/scripts/minecraft_rcon.py \
              127.0.0.1 25575 ftbpublicclaims-ci "$@"
          }

          start_server() {
            local log_file=$1
            setsid ./gradlew runServer --no-daemon --console=plain > "$log_file" 2>&1 &
            server_pid=$!

            for _ in {1..120}; do
              if grep -Eq 'Done \([0-9.]+s\)!' "$log_file"; then
                grep -Fq 'BuyClaimChunks Continued' "$log_file"
                grep -Fq 'FTB Public Claims' "$log_file"
                for _ in {1..30}; do
                  rcon list >/dev/null 2>&1 && return 0
                  sleep 1
                done
                cat "$log_file"
                echo 'RCON did not become ready.' >&2
                exit 1
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$log_file"
                echo 'Dedicated server exited before reaching Done.' >&2
                exit 1
              fi
              sleep 2
            done

            cat "$log_file"
            echo 'Dedicated server did not reach Done before timeout.' >&2
            exit 1
          }

          stop_server() {
            rcon 'save-all flush' >/dev/null
            rcon stop >/dev/null || true
            wait "$server_pid"
            server_pid=''
          }

          start_server server-persistence-first.log
          rcon 'publicclaim settings pvp false' >/dev/null
          rcon 'publicclaim settings explosions true' >/dev/null
          rcon 'publicclaim settings mob_griefing true' >/dev/null
          rcon 'publicclaim internal add_extra 7 100' >/dev/null
          rcon 'publicclaim internal claim_chunk 0 0' >/dev/null
          first_status=$(rcon 'publicclaim status')
          printf '%s\n' "$first_status" | grep -Fq \
            'pvp=false explosions=true mob_griefing=true extra=7 claims=1'
          stop_server

          start_server server-persistence-second.log
          second_status=$(rcon 'publicclaim status')
          printf '%s\n' "$second_status" | grep -Fq \
            'pvp=false explosions=true mob_griefing=true extra=7 claims=1'
          stop_server

          test "$first_status" = "$second_status"
          echo "Persisted public state and claimed chunk: $second_status"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ftbpublicclaims-build-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            ftbchunks-chunkscreen-abi.txt
            client-smoke.log
            run/logs/latest.log
            run/crash-reports/
            gametest.log
            server-persistence-first.log
            server-persistence-second.log
          if-no-files-found: warn
          retention-days: 14
