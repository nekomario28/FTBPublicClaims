name: Build

on:
  pull_request:
  push:
    branches:
      - public-claim-context
      - neoforge-1.21.1-port

permissions:
  contents: read

concurrency:
  group: ftbpublicclaims-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Download BuyClaimChunks Continued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download v1.1.1 \
            --repo nekomario28/BuyClaimChunks \
            --pattern 'buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar' \
            --dir libs

      - name: Compile and build
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Run combined NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log
          grep -Eq 'All [0-9]+ required tests passed' gametest.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ftbpublicclaims-build-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            gametest.log
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
