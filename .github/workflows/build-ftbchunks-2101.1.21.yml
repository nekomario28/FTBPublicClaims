name: Build against FTB Chunks 2101.1.21

on:
  pull_request:
  push:
    branches:
      - neoforge-1.21.1-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftbpublicclaims-ftbchunks-2101-1-21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Download BuyClaimChunks Continued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs
          gh release download v1.1.1 \
            --repo nekomario28/BuyClaimChunks \
            --pattern 'buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar' \
            --dir libs

      - name: Select FTB Chunks 2101.1.21
        run: sed -i 's/^ftb_chunks_version=.*/ftb_chunks_version=2101.1.21/' gradle.properties

      - name: Compile, test, and audit distributable JAR
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify FTB Chunks map ABI
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find ~/.gradle/caches -type f -name '*ftb-chunks-neoforge*2101.1.21*.jar' \
            ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$jar_path"
          javap -classpath "$jar_path" -private \
            dev.ftb.mods.ftbchunks.client.gui.ChunkScreenPanel | tee ftbchunks-chunkscreen-abi.txt
          javap -classpath "$jar_path" -private \
            dev.ftb.mods.ftbchunks.client.gui.ChunkScreen | tee ftbchunks-chunkscreen-accessor-abi.txt
          grep -Eq 'selectedChunks' ftbchunks-chunkscreen-abi.txt
          grep -Eq 'getChunkScreen\(' ftbchunks-chunkscreen-accessor-abi.txt

      - name: Run combined NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log
          grep -Eq 'All [0-9]+ required tests passed' gametest.log

      - name: Upload updated JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ftbpublicclaims-ftbchunks-2101.1.21-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            ftbchunks-chunkscreen-abi.txt
            ftbchunks-chunkscreen-accessor-abi.txt
            gametest.log
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
