name: Validate compatible FTB stack

on:
  pull_request:
  push:
    branches:
      - neoforge-1.21.1-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftbpublicclaims-compatible-ftb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Download BuyClaimChunks Continued
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          for attempt in 1 2 3 4 5; do
            rm -f libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar
            if gh release download v1.1.1 \
              --repo nekomario28/BuyClaimChunks \
              --pattern 'buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar' \
              --dir libs; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              echo 'Unable to download BuyClaimChunks Continued after five attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          test -s libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar

      - name: Compile, test, and audit distributable JAR
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify runtime dependency metadata matches BuyClaimChunks
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -1)
          test -n "$jar_path"
          unzip -p "$jar_path" META-INF/neoforge.mods.toml | tee packaged-neoforge.mods.toml
          grep -Fq 'modId="ftbchunks"' packaged-neoforge.mods.toml
          grep -Fq 'versionRange="[2101.1.20,2102)"' packaged-neoforge.mods.toml
          ! grep -Fq 'modId="ftbteams"' packaged-neoforge.mods.toml
          ! grep -Fq 'modId="ftblibrary"' packaged-neoforge.mods.toml
          ! grep -Fq 'modId="architectury"' packaged-neoforge.mods.toml

      - name: Verify FTB Chunks 2101.1.21 map ABI
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find ~/.gradle/caches -type f -name '*ftb-chunks-neoforge*2101.1.21*.jar' \
            ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$jar_path"
          javap -classpath "$jar_path" -private \
            dev.ftb.mods.ftbchunks.client.gui.ChunkScreenPanel | tee ftbchunks-chunkscreen-abi.txt
          javap -classpath "$jar_path" -private \
            dev.ftb.mods.ftbchunks.client.gui.ChunkScreen | tee ftbchunks-chunkscreen-accessor-abi.txt
          grep -Eq 'selectedChunks' ftbchunks-chunkscreen-abi.txt
          grep -Eq 'getChunkScreen\(' ftbchunks-chunkscreen-accessor-abi.txt

      - name: Run combined NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log
          grep -Fq 'FTB Chunks 2101.1.21' gametest.log
          grep -Fq 'FTB Teams 2101.1.10' gametest.log
          grep -Fq 'FTB Library 2101.1.34' gametest.log
          grep -Eq 'All [0-9]+ required tests passed' gametest.log

      - name: Upload compatible JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ftbpublicclaims-compatible-ftb-${{ github.sha }}
          path: |
            build/libs/*.jar
            packaged-neoforge.mods.toml
            ftbchunks-chunkscreen-abi.txt
            ftbchunks-chunkscreen-accessor-abi.txt
            gametest.log
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
